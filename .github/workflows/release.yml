name: Release to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# PRD-SEC-020 (S1 latest-pins follow-up): actions/* references below are pinned to their
# GitHub-Releases "latest" commit (checkout v7.0.1, setup-python v7.0.0, upload-artifact
# v7.0.1, download-artifact v8.0.1); pypa/gh-action-pypi-publish is pinned to v1.14.2, the
# same commit release/v1 currently resolves to (verified against the branch head). Each
# actions/* major bump moved the action's runtime to Node.js 24 and raised the minimum
# Actions Runner to v2.327.1 -- GitHub-hosted ubuntu-latest/macos-latest already satisfy
# this. download-artifact v8 defaults digest-mismatch to error (was warn-only pre-v8) --
# fail-closed is the behavior this PRD wants, and neither download step here overrides it.
# No input either job sets (name/path for artifacts; none for checkout beyond ref/
# persist-credentials) was removed or renamed by any of these jumps.

jobs:
  verify-attestation:
    # PRD-INFRA-198-FR01: publish only a tag `release_public.py cut` signed with a key in
    # .github/release-signers whose attested tree is the tree this run builds. A tag pushed
    # by hand, moved onto another tree, or replaced after the push stops here, before
    # anything is built.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Verify the release attestation
        run: |
          # Bind the check to the commit this run checked out and every job builds (GITHUB_SHA),
          # never to whatever the tag name resolves to by now: the tag object fetched below must
          # peel to that commit and attest its tree, so a tag replaced after the push is refused.
          head="$(git rev-parse HEAD)"
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::error::release attestation refused: checkout ${head} is not the triggering commit ${GITHUB_SHA}"
            exit 1
          fi
          git fetch --no-tags --force origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          python3 .github/scripts/verify_release_tag.py "${GITHUB_REF_NAME}" --commit "${GITHUB_SHA}"

  build:
    needs: verify-attestation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}  # the commit verify-attestation bound the tag to
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/

  smoke-test:
    # One smoke job on the requires-python floor. The mirrors run no test suites: every
    # gate (full suites, the platform legs) runs locally before `release_public.py cut`,
    # which refuses a tree without a passing local release-check receipt (PRD-INFRA-188
    # Amendment 02). This job only proves the built wheel installs and imports.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Install wheel + sqlite-vec
        run: pip install dist/*.whl sqlite-vec
      - name: Smoke test — SQLiteBackend graceful extension-load handling
        run: |
          python -c "
          from pathlib import Path
          import tempfile
          from datetime import datetime, timezone
          from trw_memory.storage.sqlite_backend import SQLiteBackend
          from trw_memory.models.memory import MemoryEntry, MemoryStatus
          with tempfile.TemporaryDirectory() as td:
              b = SQLiteBackend(Path(td)/'smoke.db')
              now = datetime.now(timezone.utc)
              e = MemoryEntry(id='M-smoke', content='smoke', status=MemoryStatus.ACTIVE,
                              created_at=now, updated_at=now)
              b.store(e)
              assert b.get('M-smoke', namespace=e.namespace) is not None, 'round-trip failed'
              print(f'vec_available={b._vec_available}')
          "

  publish:
    # PRD-INFRA-188 Amendment 02 (2026-09-26): publish gates on build + smoke-test.
    # The full-suite proof is the local release-check receipt `cut` enforces for this
    # exact tree; the mirror runs no suite of its own.
    # PRD-INFRA-198-FR01: the signed tag attests that receipt, verified above.
    needs: [verify-attestation, build, smoke-test]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
