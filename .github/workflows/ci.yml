name: CI

# What runs where (PRD-INFRA-188 Amendment 01):
# - Pull requests and manual dispatches run this workflow at the package baseline
#   suite (full). A dispatch can pick either suite.
# - The tag-triggered release.yml calls this workflow with suite=full, and publish
#   waits for it: the package's full pytest suite on Linux gates every release.
# - A push to main (a release sync) does not run it; the monorepo's
#   `release_public.py check` replays these steps locally before the cut, and its
#   Linux leg runs the full suite in a container when Docker is available.
# - release.yml also keeps the multi-OS installed-wheel smoke test.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "unit or full"
        type: choice
        options: [unit, full]
        default: full
      correlation_id:
        description: "set by release_public.py all so it can find this exact run"
        type: string
        default: ""
  workflow_call:
    inputs:
      suite:
        type: string
        default: full

run-name: ${{ inputs.correlation_id && format('CI {0}', inputs.correlation_id) || github.event.pull_request.title || 'CI' }}

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TRW_SUITE: ${{ inputs.suite || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vectors,bm25,mcp]"
          # pynacl: optional Ed25519 provenance signing dep. Installed so the
          # security tests EXERCISE the real signing branches (not the
          # _NACL_AVAILABLE=False fallback) — required for the INFRA-020 branch
          # coverage gate below. (mypy still passes without it via the nacl overrides.)
          pip install cryptography keyring sentence-transformers pynacl
      # ONE pin, two consumers. The TRW installer's semantic-readiness probe
      # resolves this exact snapshot (SEMANTIC_MODEL_REPO_ID /
      # SEMANTIC_MODEL_REVISION / SEMANTIC_MODEL_ALLOW_PATTERNS in
      # trw-mcp/scripts/install-trw.template.py) and checks for it with
      # local_files_only=True, so a user whose cache holds a DIFFERENT revision of
      # the same repo_id is not running what CI measured. Until 2026-09-17 this
      # step did not exist -- `git log -S 'repo_id=' -- .github/workflows/ci.yml`
      # returned nothing for the whole history of the file -- so CI resolved
      # whatever revision the hub happened to serve and the installer's pin was
      # unmirrored and ungoverned.
      #
      # Kept honest by
      # trw-mcp/tests/test_installer_semantic_readiness.py::test_pinned_fixture_matches_the_trw_memory_ci_fixture,
      # which fails the moment the two spellings diverge. Change one, change both.
      - name: Cache pinned CPU embedding fixture
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-1110a243fdf4706b3f48f1d95db1a4f5529b4d41-bge-5c38ec7c405ec4b44b94cc5a9bb96e735b38267a
      - name: Provision pinned CPU embedding fixture
        run: |
          python - <<'PROVISION'
          from huggingface_hub import snapshot_download

          snapshot_download(
              repo_id="sentence-transformers/all-MiniLM-L6-v2",
              revision="1110a243fdf4706b3f48f1d95db1a4f5529b4d41",
              allow_patterns=["*.json", "*.txt", "*.safetensors", "1_Pooling/*"],
          )
          # The daemon uses the package default BGE model, not the installer
          # MiniLM probe above. Provision both before offline CI replay.
          snapshot_download(
              repo_id="BAAI/bge-small-en-v1.5",
              revision="5c38ec7c405ec4b44b94cc5a9bb96e735b38267a",
              allow_patterns=["*.json", "*.txt", "*.safetensors", "1_Pooling/*"],
          )
          PROVISION
      - name: Lint
        run: ruff check src/
      - name: Format check (ruff format --check)
        run: ruff format --check src/ tests/
      - name: Type check
        run: mypy --strict src/trw_memory/
      # ONE suite execution feeds both coverage gates (release retrospective
      # 2026-09-17 §6 Q2: the suite used to run twice, once per gate). Branch
      # coverage is on for the whole package, so the 85% package floor now counts
      # branches as well as lines -- stricter than the old line-only gate (measured
      # 2026-09-17, macOS: 92.4% branch-inclusive vs 93.8% line-only). The security
      # gate reads the same data filtered to trw_memory/security, which is the
      # branch coverage the old ``--cov=trw_memory.security --cov-branch`` run
      # measured; measuring the whole package from startup also removes the
      # mid-collection numpy import that run needed a warm-up plugin for.
      - name: Test with coverage
        if: env.TRW_SUITE == 'full'
        run: >-
          pytest tests/ -q
          --cov=trw_memory
          --cov-branch
          --cov-report=xml:coverage.xml
          --junitxml=junit.xml
          && echo full > suite-ran.txt
      # A dispatch with suite=unit only; the coverage gates below need the full suite.
      - name: Test (unit tier)
        if: env.TRW_SUITE != 'full'
        run: pytest tests/ -m unit -q --junitxml=junit.xml && echo unit > suite-ran.txt
      - name: Verify the requested suite ran
        run: python .github/scripts/verify_suite.py --requested "$TRW_SUITE" --junit junit.xml --marker suite-ran.txt
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Coverage gate (85%, lines + branches)
        if: env.TRW_SUITE == 'full'
        run: coverage report --fail-under=85
      # INFRA-020 security coverage gate. Threshold calibrated 90 -> 88
      # (2026-06-16): the standalone CI env (full real dep set incl. pynacl and an
      # in-memory keyring backend) measured 88.57% branch coverage; the residual is
      # env-specific branches (real OS keyring backend, monorepo-path code) that do
      # not execute on a headless runner. FOLLOW-UP: targeted trw_memory.security
      # branch tests to restore a 90% floor.
      - name: INFRA-020 security coverage gate (88%, lines + branches)
        if: env.TRW_SUITE == 'full'
        run: coverage report --include='*/trw_memory/security/*' --fail-under=88
