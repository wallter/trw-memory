name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,vectors,bm25,mcp]"
          pip install cryptography keyring sentence-transformers
      - name: Lint
        run: ruff check src/
      - name: Type check
        run: mypy --strict src/trw_memory/
      - name: Test with coverage (85% fail_under)
        run: >-
          pytest tests/ -q
          --cov=trw_memory
          --cov-report=term-missing
          --cov-report=xml:coverage.xml
          --cov-fail-under=85
      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
      # INFRA-020 security coverage gate. The security package is exercised by
      # the broad client/tools/e2e tiers as well as the security-named tests, so
      # the gate runs over the full suite (a curated subset under-covers it).
      - name: INFRA-020 security coverage gate (90% branch)
        run: >-
          pytest tests/ -q
          --cov=trw_memory.security
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=90
