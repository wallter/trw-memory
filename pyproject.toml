[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trw-memory"
version = "0.1.0"
description = "Persistent memory engine with hybrid retrieval, tiered storage, and semantic dedup for AI agents"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.10"
authors = [
    { name = "TRW Framework", email = "noreply@trwframework.com" },
]
keywords = ["memory", "ai-agents", "retrieval", "embeddings", "mcp", "knowledge-management", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ruamel.yaml>=0.18.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=3.0.0,<4.0.0"]
embeddings = ["sentence-transformers>=2.0.0"]
vectors = ["sqlite-vec>=0.1.0"]
bm25 = ["rank-bm25>=0.2.0"]
llm = ["anthropic>=0.40.0"]
api = ["fastapi>=0.115.0", "uvicorn[standard]>=0.30.0"]
all = ["trw-memory[mcp,embeddings,vectors,bm25,llm,api]"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
    "ruff>=0.8.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://trwframework.com"
Documentation = "https://trwframework.com/docs"
Repository = "https://github.com/trw-framework/trw-memory"
Issues = "https://github.com/trw-framework/trw-memory/issues"

[project.scripts]
trw-memory = "trw_memory.server:main"
trw-memory-api = "trw_memory.api.app:create_app"

[tool.hatch.build.targets.wheel]
packages = ["src/trw_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["trw_memory"]
omit = ["*/server.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
