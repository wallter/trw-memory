[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trw-memory"
version = "0.1.0"
description = "Local-first memory layer for AI coding agents — store, recall, and evolve knowledge via MCP"
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "ruamel.yaml>=0.18.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
mcp = ["fastmcp>=2.0.0"]
embeddings = ["sentence-transformers>=2.0.0"]
vectors = ["sqlite-vec>=0.1.0"]
bm25 = ["rank-bm25>=0.2.0"]
llm = ["anthropic>=0.40.0"]
all = ["trw-memory[mcp,embeddings,vectors,bm25,llm]"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "mypy>=1.11.0",
]

[project.scripts]
trw-memory = "trw_memory.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trw_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.coverage.run]
source = ["trw_memory"]
omit = ["*/server.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
