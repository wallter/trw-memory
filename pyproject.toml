[build-system]
# Pinned below 1.29: hatchling 1.29+ stamps Metadata-Version 2.5, which twine 7.0 /
# packaging 26.3 reject ("'2.5' is not a valid metadata version"). Every wheel we
# have published carries 2.4. Re-verified 2026-09-05 in the release rehearsal.
requires = ["hatchling>=1.27,<1.29"]
build-backend = "hatchling.build"

[project]
name = "trw-memory"
version = "4.0.1"
description = "Persistent memory engine with hybrid retrieval, tiered storage, and semantic dedup for AI agents"
readme = "README.md"
license = "BUSL-1.1"
requires-python = ">=3.10"
authors = [
    { name = "TRW Framework", email = "noreply@trwframework.com" },
]
keywords = ["memory", "ai-agents", "retrieval", "embeddings", "mcp", "knowledge-management", "semantic-search"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # GHSA-g6cj-pr64-35w5 (CVE-2026-69247, Bleichenbacher oracle in PKCS#7
    # EnvelopedData decryption) is fixed in 50.0.0; trw-memory imports
    # cryptography directly in security/keys.py (the Ed25519 fallback).
    "cryptography>=50.0.0",
    "httpx>=0.27.0",
    # PyNaCl backs Ed25519 provenance signing AND verification. It used to be
    # undeclared -- named only in prose and a deptry ignore -- so no install
    # command anywhere turned signature verification on. CI installed it bare
    # and verified properly while every user install silently skipped the
    # check; `verify_signed` returned the same None that means "verified
    # cleanly". Required now, and `verify_signed` refuses rather than degrades.
    # 1.4 MB, 24 wheels incl. manylinux_2_17 x86_64/aarch64 and macOS
    # universal2, so there is no platform argument for leaving it optional.
    "pynacl>=1.5.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "ruamel.yaml>=0.18.0",
    "structlog>=24.0.0",
    # Dense (vector) recall is on for every install (6.1.0 / 3.1.0): sqlite-vec is a
    # base dependency, not the old [vectors] extra that a default install skipped.
    # 0.1.5 is the first release with a manylinux aarch64 wheel. No release ships a
    # musllinux wheel or an sdist, so musl (Alpine) and Windows ARM fail at pip time:
    # an install failure is truthful where silently keyword-only recall is not.
    "sqlite-vec>=0.1.5",
    # BM25 keyword ranking is on for every install (PRD-CORE-302 FR08, 7.0.0):
    # without it EngMem complete@10 fell 0.988 -> 0.713 (N=80, 5 seeds) and
    # the default-on entity-bridge hop raised NameError. rank-bm25 declares an
    # unconstrained numpy dep; numpy>=2.5 drops Python 3.10, which trw-memory
    # still supports, so the ceiling holds it on a 3.10-compatible numpy.
    "rank-bm25>=0.2.0",
    "numpy<2.5",
    "typing-extensions>=4.6.0",
    # Assertion grep patterns are caller-supplied and run in the shared daemon: `regex`
    # enforces a match deadline and releases the GIL, where stdlib `re` can hang (C12 ReDoS).
    "regex>=2024.11.6",
    # --- formerly the [mcp] extra; now REQUIRED ---
    # The package's own console script already depended on it unconditionally:
    # `cli.py` imports `cli_namespace`, which imports `daemon.client`, which
    # does a hard module-level `from fastmcp import Client`. So
    # `pip install trw-memory` shipped a `trw-memory` entry point that raised
    # ModuleNotFoundError on EVERY invocation while the README presented that
    # install as supported. `import trw_memory` still worked, which is why it
    # went unnoticed -- and CI installed `.[dev,vectors,bm25,mcp]`, so a
    # core-only install was never exercised.
    "fastmcp>=3.2.0,<4.0.0",
    # The floors below pin fastmcp's own transitive deps past their patched
    # advisories (2026-09 dependabot sweep); fastmcp's own version range does
    # not force these on its own.
    "mcp>=1.28.1",  # GHSA-vj7q-gjh5-988w / GHSA-jpw9-pfvf-9f58 / GHSA-hvrp-rf83-w775
    "python-multipart>=0.0.31",  # GHSA-5rvq-cxj2-64vf / GHSA-v9pg-7xvm-68hf / GHSA-6jv3-5f52-599m / GHSA-vffw-93wf-4j4q
    "starlette>=1.3.1",  # GHSA-jp82-jpqv-5vv3 / GHSA-82w8-qh3p-5jfq
    "joserfc>=1.6.8",  # GHSA-gg9x-qcx2-xmrh / GHSA-wphv-vfrh-23q5 (pulled via authlib)
]

[project.optional-dependencies]
sqlite-fix = [
    # OPT-IN engine override, not a fix that ships. Measured 2026-09-16:
    # pysqlite3-binary 0.5.4.post2 bundles SQLite 3.51.1, BELOW the 3.51.3
    # WAL-reset fix it was added here to deliver, and it publishes exactly one
    # wheel (manylinux2014_x86_64) — so it made aarch64 Linux installs fail
    # outright while delivering nothing on x86_64. It is now optional and marked
    # for the one platform that has a wheel; on macOS, Windows and arm64 Linux
    # this extra resolves to nothing and the install still succeeds.
    #
    # Installing it does not necessarily change the engine: storage/_dbapi.py
    # ranks candidates on (carries the WAL-reset fix, version) and keeps the
    # interpreter's own SQLite when the wheel is older, which it is on any
    # current CPython.
    "pysqlite3-binary>=0.5.4; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
# No [encryption] extra: encryption at rest is refused (EncryptionAtRestUnsupportedError) and its
# SQLCipher and master-key code was removed in 4.1; use full-disk encryption.
embeddings = [
    "sentence-transformers>=2.0.0",
    # numpy>=2.5 drops Python 3.10 support (and ships PEP-695 `type X = ...`
    # stubs that mypy rejects under python_version="3.10"), which trw-memory
    # still supports. Pin below 2.5 wherever a transitive dep (here
    # sentence-transformers) pulls numpy in unconstrained.
    "numpy<2.5",
    # sentence-transformers' own range does not force these past their
    # patched advisories (2026-09 dependabot sweep).
    "torch>=2.13.0",  # GHSA-rrmf-rvhw-rf47
    "transformers>=5.10.0",  # GHSA-xrqw-3rrv-vx5w
    "setuptools>=83.0.0",  # GHSA-h35f-9h28-mq5c
]
# `mcp` dropped from this alias: it is now a required dependency, so naming
# it here would reference a nonexistent extra and pip would warn.
all = ["trw-memory[embeddings]"]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.5.0",  # speed/gh-release-workflow: full-suite CI parallelism (parity with trw-mcp)
    "mypy>=1.11.0,<2.0",  # pin to the 1.x line: mypy 2.x is a major release with behavior changes that a raw `pip install .[dev]` would resolve (2.3.0), diverging from the verified uv.lock (1.20.2). Migrate to 2.x deliberately, not via CI drift.
    "ruff>=0.15.0,<0.16",  # CI installs .[dev]; a newer minor adds rules the repo has not adopted yet
    "tomli>=2.0.1; python_version < '3.11'",
    "httpx>=0.27.0",
    "pip-audit>=2.7.0",
    "vulture>=2.11",
    "deptry>=0.21.0",
    # pip-audit's own range does not force these transitive deps past their
    # patched advisories (2026-09 dependabot sweep).
    "msgpack>=1.2.1",  # GHSA-6v7p-g79w-8964 (pulled via cachecontrol)
    "pip>=26.2.0",  # GHSA-qwm4-qh6w-59xr (pulled via pip-api)
]

[project.urls]
Homepage = "https://trwframework.com"
Documentation = "https://trwframework.com/docs"
Repository = "https://github.com/wallter/trw-memory"
Issues = "https://github.com/wallter/trw-memory/issues"
Changelog = "https://trwframework.com/docs/changelog"

[project.scripts]
trw-memory = "trw_memory.cli:main"
trw-memory-server = "trw_memory.server:main"

[tool.hatch.build.targets.wheel]
# Same per-target exclusion as the sdist below — hatchling does not share them,
# so without this the wheel `pip install` delivers ships src/trw_memory/security/
# CLAUDE.md, which records that the memory-poisoning defense, trust scoring and
# quarantine are all observe/log-only. Found in pre-release review, 2026-09-11.
packages = ["src/trw_memory"]
exclude = ["/CHANGELOG.md", "**/CLAUDE.md", "**/AGENTS.md"]

[tool.hatch.build.targets.sdist]
# Defense in depth alongside .gitignore: hatchling honors the package-local
# .gitignore but NOT a global git excludesfile, so local runtime/test state
# (the .memory/ store dirs, coverage artifacts, stray SQLite files) must be
# excluded explicitly here too — they must never ship in the published sdist.
#
# The agent-facing dev docs (CLAUDE.md / AGENTS.md / FRAMEWORK.md) and the uv
# lockfile are monorepo development artifacts, not part of the published
# library — they are excluded so the public PyPI sdist carries only library
# sources, packaging metadata, and the license/readme.
exclude = [
  "/CHANGELOG.md",
  ".memory",
  "coverage.json",
  "*.db",
  "*.db-wal",
  "*.db-shm",
  "uv.lock",
  "CLAUDE.md",
  "AGENTS.md",
  "FRAMEWORK.md",
]

[tool.deptry]
known_first_party = ["trw_memory"]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
# Optional probe: text embeddings can hide a broken torchcodec install during
# sentence-transformers import, but torchcodec itself is not required.
DEP001 = ["torchcodec"]
# Optional extras / self-referential aggregate extras are intentionally not
# imported in the core package scan. numpy is declared only for its <2.5
# ceiling (Python 3.10); rank-bm25 is what imports it.
DEP002 = ["numpy", "trw-memory"]
# `nacl` is the import name for the pynacl distribution, which IS a declared
# core dependency -- the mapping is what deptry cannot infer, not the absence
# of a declaration. This ignore previously read "PyNaCl-backed signing is
# optional ... the chain helpers degrade explicitly", which was the reason the
# undeclared dependency went unnoticed; verification degraded SILENTLY, not
# explicitly.
DEP003 = ["nacl"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    # --- Foundations ---
    "E",        # pycodestyle errors
    "W",        # pycodestyle warnings
    "F",        # Pyflakes: unused imports (F401), undefined names (F821), unused vars (F841)

    # --- Import hygiene ---
    "I",        # isort: consistent import ordering

    # --- Bug patterns (catches redundant except, mutable defaults, unused loop vars) ---
    "B",        # flake8-bugbear: B014 duplicate exception handler, B006 mutable defaults, B018 useless expr

    # --- Modern Python syntax ---
    "UP",       # pyupgrade: deprecated aliases, union types (X | Y)

    # --- Code simplification ---
    "SIM",      # flake8-simplify: SIM102 nested-if, SIM105 contextlib.suppress
    "RET",      # flake8-return: RET504 assign-then-return, RET505-508 superfluous else
    "PIE",      # flake8-pie: PIE790 unnecessary pass, PIE794 duplicate class field

    # --- Exception handling quality ---
    "TRY",      # tryceratops: TRY201 verbose raise, TRY301 raise-in-try

    # --- Async safety ---
    "ASYNC",    # flake8-async: blocking I/O in async functions

    # --- pytest hygiene ---
    "PT",       # flake8-pytest-style: fixture/assert/exception style

    # --- Type checking optimization ---
    "TC",       # flake8-type-checking: move type-only imports to TYPE_CHECKING

    # --- Ruff-native ---
    "RUF",      # RUF012 mutable ClassVar, RUF100 unused noqa

    # --- Expanded rule sets (PRD-QUAL-046 FR07) ---
    "C4",       # flake8-comprehensions: unnecessary list/dict comprehension
    "PERF",     # performance anti-patterns
    "G",        # flake8-logging-format: logging format strings
    "S",        # bandit: security checks
    "DTZ",      # flake8-datetimez: timezone-aware datetime
    "FURB",     # refurb: modern Python idioms
    "C901",     # McCabe complexity
    "ANN",      # flake8-annotations: type annotations
]
ignore = [
    "E501",     # line too long — handled by line-length setting
    "TRY003",   # long exception messages inline are fine in application code
    "TRY002",   # raising ValueError/TypeError directly is idiomatic in libraries
    "TRY300",   # return-in-try is standard CLI handler pattern (try/except/finally)
    "TRY301",   # raise-within-try is sometimes the cleanest error-wrap pattern
    "SIM108",   # ternary operator is not always more readable than if/else
    "SIM105",   # contextlib.suppress vs try/except/pass is a style choice; codebase chooses try/except
    "RET504",   # assign-then-return is often clearer than inline return
    "TC001",    # typing imports used at runtime via Pydantic models — not type-checking-only
    "TC002",    # third-party imports used at runtime — not type-checking-only
    "TC003",    # stdlib imports used at runtime in constructors — not type-checking-only
    "B008",     # function calls in defaults — FastMCP/Pydantic patterns use this idiomatically
    "ISC001",   # conflicts with formatter
    "ANN401",   # Any annotations are intentional at JSON/config/MCP-boundary surfaces
    "PERF203",  # try-except inside loops is required for per-item error handling
    "C901",     # McCabe complexity is a code-review concern; max-complexity already capped at 15
    "RUF002",   # ambiguous unicode in docstrings (math glyphs intentional)
]
fixable = ["F401", "B007", "B013", "B014", "UP", "I", "PIE790", "PIE810", "TC", "RUF100", "RUF022", "RUF023", "SIM110", "SIM102", "SIM114", "SIM300", "PERF401", "TRY400", "C401", "C420", "B905"]
unfixable = ["F841"]  # never auto-delete "unused" variables (could be side-effect assignments)

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["PT", "TRY", "SIM", "B018", "RUF012", "F841", "E741", "B017", "RUF059", "B905", "ANN", "S101", "S", "G"]
"benchmarks/**/*.py" = ["TRY", "PT", "B905"]
"src/trw_memory/cli.py" = ["ASYNC230", "ASYNC240", "G201", "TRY400"]  # CLI: blocking I/O fine, structured error logging at boundary
"**/__init__.py" = ["F401", "E402"]  # re-exports after NullHandler init are intentional
"**/conftest.py" = ["PT"]
"src/trw_memory/_logging.py" = ["ANN401", "S110"]  # structlog processor convention; S110: best-effort version binding

[tool.ruff.lint.isort]
known-first-party = ["trw_memory"]
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not slow'"
asyncio_mode = "auto"
markers = [
  "unit: pure unit tests — no filesystem I/O beyond tmp_path, mocks only, fast",
  "integration: uses real filesystem / sqlite / network — slower, still isolated",
  "slow: individual-test runtime > 5 seconds — excluded from default runs",
  "network: requires external network access (embedding models, API calls)",
  "requires_local_timing: a host-resource budget (wall-clock, throughput, RSS); skipped on CI runners, measured by the non-gating timing job (PRD-QUAL-141)",
]

[tool.mypy]
strict = true
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true

# Optional dependencies that lack type stubs — ignore on a per-module basis
# so `mypy --strict` passes even when a minimal `.[dev]` install is used.
# Each override uses a separate table entry because mypy requires the module
# field to be a glob string (not a list) in older versions.
[[tool.mypy.overrides]]
module = "sentence_transformers"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sentence_transformers.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Pulled in only by the [embeddings] extra; _hf_cache imports it lazily and
# treats ImportError as "cache state unknown".
module = "huggingface_hub"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlite_vec"
ignore_missing_imports = true

# pysqlite3 is an OPTIONAL engine override ([sqlite-fix], x86_64 Linux only), so
# on every other platform the import is unresolved and an inline
# `type: ignore[import-untyped]` becomes an unused-ignore error there. Routing it
# through the override list makes the check platform-independent — the same fix
# commit 39274a997 applied to trw-mcp.
[[tool.mypy.overrides]]
module = "pysqlite3"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "regex"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastmcp"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastmcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cryptography"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cryptography.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nacl"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "nacl.*"
ignore_missing_imports = true

# PyNaCl is an optional dep. The signing-key fallbacks in these two modules
# carry `# type: ignore[misc,assignment]` that is USED when PyNaCl is present
# (real nacl types -> rebinding to Any is a genuine error these ignores
# suppress) but UNUSED when PyNaCl is absent (e.g. the public CI dep set,
# where nacl resolves to Any via the override above). `warn_unused_ignores`
# would therefore fire in CI only. Disabling it for just these modules keeps
# both environments green without env-dependent source edits.
[[tool.mypy.overrides]]
module = ["trw_memory.security.provenance", "trw_memory.security.keys"]
warn_unused_ignores = false

[tool.coverage.run]
source = ["trw_memory"]
omit = ["*/server.py"]

[tool.coverage.report]
fail_under = 85  # PRD-INFRA-042: normalized across packages (mcp=80, memory=85, eval=85, backend=75)
show_missing = true
